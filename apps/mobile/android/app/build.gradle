plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.qismawanasib.app"
    // NOTE: screen_protector declares a compileSdkVersion of 36, which
    // produces a "requires Android SDK version 36 or higher" build warning
    // here. Bumping compileSdk to 36 was tried and reverted: this Flutter
    // SDK's bundled aapt2 cannot parse the API 36 android.jar's resource
    // table format ("RES_TABLE_TYPE_TYPE entry offsets overlap actual entry
    // data"), which is an aapt2/platform-tools version mismatch, not a real
    // code incompatibility. screen_protector only wraps a screenshot-block
    // platform channel (FLAG_SECURE on Android) that doesn't need API 36
    // features, so compiling against the default SDK (34) here is safe;
    // the warning is expected and can be ignored unless a future upgrade
    // of the Flutter SDK / Android build-tools resolves the aapt2 issue.
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.qismawanasib.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // screen_protector's Android implementation requires API 21+; bumped
        // from flutter.minSdkVersion (19) accordingly.
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
